# London Local: what to wear, where to run, and how to get there.
# See CLAUDE.md for the rules this file follows.

manifest_version: 1

# Every hackathon app keeps nothing between calls.
persistence: none

# Public pseudonym shown as "by <name>" next to the app.
app_author_name: "Local Ravens"

app:
  id: hack.app_eba2
  name: London Local
  version: 0.2.0
  # Never use the word "by" here: the badge is split on it.
  summary: >-
    London helper: emoji weather outfits, park jog routes, tube strikes,
    finding saved spots and on-this-date throwbacks. Uses Open-Meteo,
    OpenStreetMap and TfL; sends only the place names you give.

agent_types:
  - personal

outcomes:
  # ── 1. What to wear ───────────────────────────────────────────────────────
  - id: london.outfit
    summary: Say what to wear in London for the weather, drawn as an emoji outfit
    example_phrases:
      - what should i wear in london
      - do i need an umbrella
      - do i need a coat
      - what to wear for the weather
      - how should i dress for the weather
      - is it raincoat weather
      - should i bring a jacket
      - dress my avatar for the weather
    inputs:
      - name: place
        type: string
        required: false
        description: >-
          The London area or place the person asked about, for example
          "Camden" or "Imperial College". If they named no place, return an
          empty string rather than guessing.
      - name: day
        type: string
        required: false
        description: >-
          Which day they mean, as they said it: "tomorrow", a weekday name such
          as "Saturday", or a date as YYYY-MM-DD. If they did not say, return
          an empty string (that means the current day).
    output:
      - name: place
        type: string
      - name: day
        type: string
        description: The day the forecast is for, e.g. "Friday 20 November".
      - name: conditions
        type: string
        description: The weather in words, e.g. "light drizzle".
      - name: avatar
        type: string
        description: An emoji person wearing the outfit, e.g. "🌧️ 🧍 🧥🧣☂️👢".
      - name: outfit
        type: string
        description: The clothes to wear, each with its emoji.
      - name: temperature_low_c
        type: number
      - name: temperature_high_c
        type: number
      - name: feels_like_low_c
        type: number
      - name: feels_like_high_c
        type: number
      - name: rain_chance_percent
        type: integer
      - name: rain_mm
        type: number
      - name: wind_kmh
        type: number
      - name: rain_timing
        type: string
        required: false
        description: When rain is likely to start, or that it stays dry.

  # ── 2. Jogging route ──────────────────────────────────────────────────────
  - id: london.jog
    summary: Plan a jogging or running route of a set distance to a London park and back
    example_phrases:
      - plan a jogging route
      - i want to jog 5km and back
      - suggest a running route
      - where can i go for a run
      - 10k running loop starting at
      - good park for a jog
      - plan my morning run
    inputs:
      - name: start
        type: string
        required: false
        description: >-
          Where the run starts and ends, for example "Imperial College" or
          "King's Cross". If no starting place is in the message, return an
          empty string rather than guessing.
      - name: distance_km
        type: number
        required: false
        description: >-
          The total distance the person wants to run, in kilometres. Convert
          miles to km (1 mile = 1.609 km); "5k" means 5. Leave this out
          entirely if they gave no distance. Never guess one.
    output:
      - name: start
        type: string
      - name: distance_km
        type: number
        description: The distance asked for (5 km if none was given).
      - name: park
        type: string
        description: The park the route goes to, or empty if none is close enough.
      - name: route
        type: string
        description: The proposed route, step by step, with estimated distances.
      - name: total_km
        type: number
        description: Estimated total distance of the proposed route.
      - name: other_parks
        type: string
        required: false
        description: Other parks that would also work for this distance.

  # ── 3. Journey and strikes ────────────────────────────────────────────────
  - id: london.journey
    summary: Plan a London public transport journey from A to B and say which tube strikes or delays affect it
    example_phrases:
      - how do i get from a to b
      - best way to travel from
      - is there a tube strike
      - which tube lines are on strike
      - is the tube running
      - will the strike affect my journey
      - tube from to
      - quickest way across london to
    inputs:
      - name: origin
        type: string
        required: false
        description: >-
          Where the journey starts: a station, street, postcode or landmark in
          London. If the message does not say, return an empty string rather
          than guessing.
      - name: destination
        type: string
        required: false
        description: >-
          Where the journey ends: a station, street, postcode or landmark in
          London. If the message does not say, return an empty string rather
          than guessing.
    output:
      - name: origin
        type: string
      - name: destination
        type: string
      - name: best_route
        type: string
        description: The quickest route TfL suggests, leg by leg, with minutes.
      - name: best_route_minutes
        type: integer
      - name: best_route_affected
        type: boolean
        description: True if a line on the best route has a strike, delay or closure.
      - name: line_problems
        type: string
        description: Strikes, closures and delays on the lines these routes use.
      - name: other_routes
        type: string
        required: false
        description: Up to two alternative routes.
      - name: fare
        type: string
        required: false
        description: Pay-as-you-go fare for the best route, e.g. "£3.30".
      - name: strikes_elsewhere
        type: string
        required: false
        description: Strike notices on other tube and rail lines.

  # ── 4. Find a saved spot ──────────────────────────────────────────────────
  - id: london.find_spot
    summary: Find a saved or remembered spot in London or the UK, with its address and directions
    example_phrases:
      - where is that place with the
      - find that spot i saw on instagram
      - directions to that cafe
      - how far is that place from
      - the ramen place near london bridge
      - where was that rooftop bar
      - address of the spot i saved
      - that restaurant with the glass dome
    inputs:
      - name: spot
        type: string
        required: false
        description: >-
          The place's name or location tag, if the message has one, for
          example "Sky Garden". Ignore links and URLs entirely. If no name is
          given, return an empty string rather than guessing.
      - name: description
        type: string
        required: false
        description: >-
          What the person remembers about the place, in their words, for
          example "ramen near London Bridge", "rooftop bar" or "glass dome".
          Keep any "near ..." part. If there is none, return an empty string.
      - name: start
        type: string
        required: false
        description: >-
          Where they would set off from, if they said, for example "King's
          Cross". If they did not say, return an empty string rather than
          guessing.
    output:
      - name: name
        type: string
      - name: type
        type: string
      - name: area
        type: string
      - name: address
        type: string
      - name: directions_url
        type: string
        description: A Google Maps link with public transport directions.
      - name: source
        type: string
        description: '"saved" (from their saved spots), "lookup" (found by name) or "description".'
      - name: other_matches
        type: array
        item_type: string
        description: Other places that could be the one they mean.
      - name: distance_km
        type: number
        required: false
        description: Straight-line distance from the starting point.
      - name: walk_minutes
        type: integer
        required: false
      - name: transit_minutes
        type: integer
        required: false
        description: Quickest public transport time, from TfL (London only).
      - name: start_resolved
        type: string
        required: false
        description: The starting point as it was found on the map.

  # ── 5. On this date ───────────────────────────────────────────────────────
  - id: london.on_this_day
    summary: Throwback to saved spots that were posted on this date in earlier years
    example_phrases:
      - on this day
      - spots posted on this date
      - a year ago on this date
      - throwback to places from this date
      - what places were posted on this day in past years
      - anniversary of spots i saved
      - memories from this date
    inputs: []
    output:
      - name: date_checked
        type: string
      - name: spots
        type: array
        item_type: string
        description: Spots posted on this date in earlier years, newest first.
      - name: years_ago
        type: array
        item_type: integer
        description: How many years ago each of those spots was posted.
      - name: nearest_other_date
        type: string
        required: false
        description: If none match, the saved spot posted nearest to this date.
